<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Підключення шрифту Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Roboto+Serif:ital,opsz,wght@0,8..144,100..900;1,8..144,100..900&family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <!-- Підключення шрифту Inter -->
    <link rel="stylesheet" href="stylemenu.css">
</head>
<body bgcolor="F7B3B3">
    <main class="main">
        <div class="menu-option">
            <a href="#">
                <img src="images/Menu image.png" alt="Menu option">
            </a>
        </div>
        <h1>
            Menu
        </h1>
        <div class="search">
            <input type="text" placeholder="Search food here">
        </div>
        <div class="list-menu">
            <div class="block-menu">
                <div class="block-one-background">
                    <div class="img-food">
                        <img src="images/Food image.png" alt="Food" width="37" height="37">
                    </div> 
                </div>
                <h3 class="food-h3">
                    Food
                </h3>  
            </div>
            <div class="block-menu">
                <div class="block-two-background">
                    <div class="img-drink">
                        <img src="images/Drinks image.png" alt="Drinks">
                    </div>
                </div>
                <h3 class="drinks-h3">
                    Drinks
                </h3>
            </div>
            <div class="block-menu">
                <div class="block-three-background">
                    <div class="img-dessert">
                        <img src="images/Dessert.png" alt="Dessert">
                    </div>
                </div>
                <h3 class="dessert-h3">
                    Dessert
                </h3>
            </div>
        </div>
        <div>
            <h2>
                Burger
            </h2>
        </div>
        <div class="list-burgers">
            <div class="burger">
                <div class="bigmac-image">
                    <img src="images/Big Mac.png" alt="Big Mac" width="60" height="68.51">
                </div>
                <div class="burgers-menu">
                    <p>
                        Big Mac
                    </p>
                    <p class="price">
                        Rs 240
                    </p>
                </div>
            </div> 
            <div class="burger">
                <div class="kfc-image">
                    <img src="images/KFC Double.png" alt="KFC" width="60.77" height="55.43">
                </div>
                <div class="burgers-menu">
                    <p>
                        KFC Double
                    </p>
                    <p class="price">
                        Rs 252
                    </p>
                </div>
            </div>  
            <div class="burger">
                <div class="fish-image">
                    <img src="images/Fish Burger.png" alt="Fish" width="70" height="60">
                </div>
                <div class="burgers-menu">
                    <p>
                        Fish Burger
                    </p>
                    <p class="price">
                        Rs 220
                    </p>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
